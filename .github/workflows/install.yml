name: install

on:
  push:
    paths:
      - install.sh
      - test.sh
      - Brewfile
      - mise/**
      - zsh/**
      - .github/workflows/install.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TERM: xterm-256color

jobs:
  linux:
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "archlinux:latest"]
    steps:
      - name: Install git
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && apt-get install -y git
          else
            pacman -Syu --noconfirm git
          fi
      - uses: actions/checkout@v4
      - run: cp -R "$GITHUB_WORKSPACE" "$HOME/pdotfiles"
      - run: ~/pdotfiles/install.sh
      - run: ~/pdotfiles/test.sh

  macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -f ~/.zshrc ~/.zprofile
          cp -R "$GITHUB_WORKSPACE" "$HOME/pdotfiles"
      - run: ~/pdotfiles/install.sh
      - run: ~/pdotfiles/test.sh
